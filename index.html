<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attitude Bench · spin a spacecraft, watch the math follow</title>
    <meta name="description" content="Interactive spacecraft attitude for AE 426: direction cosine matrices, Euler angles, single-axis rotation and quaternions, live and in the course's notation." />
    <meta property="og:title" content="Attitude Bench" />
    <meta property="og:description" content="Spin a spacecraft and watch [Q], α β γ, the SAR axis and the quaternion update together." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0D1322" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      (function () {
        try {
          var s = localStorage.getItem("attitude-bench:theme");
          var map = { obsidian: "dark", slate: "dark", daylight: "light", sepia: "light" };
          var m = s === "dark" || s === "light" ? s : map[s] || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
          document.documentElement.dataset.theme = m;
          if (m === "light") document.documentElement.style.background = "#FBF8F2";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
